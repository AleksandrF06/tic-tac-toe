<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="game(solo Win).css">
    <link rel="stylesheet" href="base.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div class="page">
        <div class="mainContent">
            <div class="mainContent__header">
                <div class="header__logo">
                    <div class="logo__x-mark"><span></span></div>
                    <div class="logo__o-mark"><span></span></div>
                </div>
                <div class="header__turn-button">
                    <div class="header__turn"><span class="header__turn-symbol"></span> <span>TURN</span></div>
                </div>
                <div class="header__restart"><img src="pic/restart.svg" alt=""></div>
            </div>
            <div class="mainContent__field">
                <div class="field__row row-1">
                    <div class="row__block block-1"><div class="block__x-mark"><span></span></div></div>
                    <div class="row__block block-2"><div class="block__x-mark"><span></span></div></div>
                    <div class="row__block block-3"><div class="block__x-mark"><span></span></div></div>
                </div>
                <div class="field__row row-2">
                    <div class="row__block block-1"><div class="block__x-mark"><span></span></div></div>
                    <div class="row__block block-2"><div class="block__o-mark"><span></span></div></div>
                    <div class="row__block block-3"><div class="block__x-mark"><span></span></div></div>
                </div>
                <div class="field__row row-3">
                    <div class="row__block block-1"></div>
                    <div class="row__block block-2"><div class="block__o-mark"><span></span></div></div>
                    <div class="row__block block-3"><div class="block__x-mark"><span></span></div></div>
                </div>
            </div>
            <div class="mainContent__footer">
                <div class="footer__x-wins footer__button"><span>X (YOU) </span> <span>14</span></div>
                <div class="footer__ties footer__button"><span>TIES</span> <span>32</span></div>
                <div class="footer__o-wins footer__button"><span>O (CPU)</span> <span>11</span></div>
            </div>
        </div>
    </div>
    <div class="overlay">
            <div class="overlay__content">
                <div class="overlay__title"><span>YOU WON!</span></div>
                <div class="overlay__winner"><span></span> <span>TAKES THE ROUND</span></div>
                <div class="overlay__buttons">
                    <div class="overlay__button-quit">QUIT</div>
                    <div class="overlay__button-next-round">NEXT ROUND</div>
                </div>
            </div>
        </div>
</body>
</html>
