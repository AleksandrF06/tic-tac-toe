<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="menu.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>tic-tac-toe</title>
</head>
<body>
    <div class="page">
        <div class="mainContent">
            <div class="mainContent__logo">
                <div class="logo__x-mark"><span></span></div>
                <div class="logo__o-mark"><span></span></div>
            </div>
            <div class="mainContent__picks">
                <span class="picks__pick">PICK PLAYER 1'S MARK</span>
                <div class="mainContent__choice">
                    <div class="choice__marks">
                        <div class="choice__x-mark"><span></span></div>
                        <div class="choice__o-mark"><span></span></div>
                    </div>
                </div>
                <span class="picks__remember">REMEMBER : X GOES FIRST</span>
            </div>
            <div class="mainContent__mode">
                <div class="mainContent__button-1 button"><span class="button__text">NEW GAME (VS CPU)</span></div>
                <div class="mainContent__button-2 button"><span class="button__text">NEW GAME  (VS PLAYER)</span></div>
            </div>
        </div>
    </div>
</body>
</html>
